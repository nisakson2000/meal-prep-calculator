<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Prep Calculator - Trust The Skinny Chef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0a1a;--card:#12122a;--panel:#0d1b3e;
            --bdr:rgba(255,255,255,.06);--bdr-h:rgba(233,69,96,.5);
            --acc:#e94560;--acc-g:rgba(233,69,96,.4);--acc-s:rgba(233,69,96,.12);
            --grn:#53d769;--yel:#ffcc00;--blu:#5ac8fa;
            --t:#e8e8f0;--td:#8888aa;--tf:#555577;
            --r:14px;--rs:8px;
        }
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow:hidden}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(233,69,96,.3);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(233,69,96,.5)}

        header{background:linear-gradient(135deg,rgba(15,20,50,.95),rgba(13,27,62,.95));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:1rem 1.5rem;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;position:sticky;top:0;z-index:100}
        header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:shimmer 3s ease-in-out infinite;background-size:200% 100%}
        header h1{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;color:#fff;font-weight:700;letter-spacing:-.5px}
        header h1 span{background:linear-gradient(135deg,#e94560,#ff6b81,#e94560);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradShift 4s ease infinite}
        .header-controls{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
        .search-box{padding:.5rem 1rem;border:1px solid var(--bdr);border-radius:25px;background:rgba(255,255,255,.04);color:#fff;font-family:'Inter',sans-serif;font-size:.85rem;width:240px;transition:all .3s}
        .search-box:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s);background:rgba(255,255,255,.06)}
        .search-box::placeholder{color:var(--tf)}
        .category-filters{display:flex;gap:.35rem}
        .cat-btn{padding:.35rem .85rem;border:1px solid var(--bdr);border-radius:25px;background:transparent;color:var(--td);cursor:pointer;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:500;transition:all .3s;letter-spacing:.3px}
        .cat-btn:hover{border-color:var(--bdr-h);color:#fff;background:rgba(233,69,96,.08)}
        .cat-btn.active{background:linear-gradient(135deg,var(--acc),#ff6b81);border-color:transparent;color:#fff;box-shadow:0 2px 12px var(--acc-g)}
        .main-layout{display:flex;height:calc(100vh - 56px)}

        .recipe-panel{flex:1;padding:1.2rem;overflow-y:auto}
        .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
        .recipe-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.25,.46,.45,.94);position:relative;animation:fadeUp .4s ease backwards}
        .recipe-card::before{content:'';position:absolute;inset:0;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,transparent 40%,rgba(233,69,96,.3));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none}
        .recipe-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 20px rgba(233,69,96,.08)}
        .recipe-card:hover::before{opacity:1}
        .recipe-card.selected{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 4px 20px var(--acc-g)}
        .recipe-card.selected::after{content:"\2713";position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--acc),#ff6b81);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.8rem;z-index:2;box-shadow:0 2px 10px var(--acc-g);animation:fadeUp .2s ease}
        .recipe-img{width:100%;height:145px;object-fit:cover;display:block;transition:transform .4s ease}
        .recipe-card:hover .recipe-img{transform:scale(1.05)}
        .recipe-img-placeholder{width:100%;height:145px;background:linear-gradient(135deg,var(--panel),var(--card));display:flex;align-items:center;justify-content:center;color:var(--tf);font-size:2rem}
        .recipe-info{padding:.65rem .75rem .75rem}
        .recipe-category{font-size:.6rem;color:var(--tf);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:.25rem}
        .recipe-name{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;color:#fff;margin-bottom:.4rem;line-height:1.25}
        .recipe-macros{display:flex;gap:.3rem;flex-wrap:wrap;font-size:.68rem;font-weight:500}
        .macro-badge{padding:.15rem .4rem;background:rgba(255,255,255,.04);border-radius:5px;border:1px solid rgba(255,255,255,.04)}
        .macro-badge.cal{color:var(--acc);border-color:rgba(233,69,96,.15)}
        .macro-badge.prot{color:var(--grn);border-color:rgba(83,215,105,.15)}
        .macro-badge.fat{color:var(--yel);border-color:rgba(255,204,0,.12)}
        .macro-badge.carb{color:var(--blu);border-color:rgba(90,200,250,.12)}
        .recipe-servings{font-size:.62rem;color:var(--tf);margin-top:.3rem;font-weight:500}

        .prep-panel{width:440px;min-width:440px;background:linear-gradient(180deg,var(--panel),rgba(10,15,35,.98));border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:visible;position:relative}
        .prep-panel::before{content:'';position:absolute;top:0;left:0;width:1px;height:100%;background:linear-gradient(180deg,var(--acc),transparent);opacity:.3}
        .prep-header{padding:1.1rem 1.3rem;border-bottom:1px solid var(--bdr)}
        .prep-header h2{font-family:'Space Grotesk',sans-serif;font-size:1rem;margin-bottom:.9rem;color:#fff;font-weight:700;letter-spacing:-.3px}
        .serving-controls{display:flex;gap:.8rem;margin-bottom:.7rem}
        .serving-group{flex:1}
        .serving-group label{display:block;font-size:.7rem;color:var(--td);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
        .serving-group input{width:100%;padding:.55rem;border:1px solid var(--bdr);border-radius:var(--rs);background:rgba(255,255,255,.03);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;text-align:center;transition:all .3s}
        .serving-group input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
        .total-servings{text-align:center;font-size:.8rem;font-weight:700;color:var(--acc);padding:.55rem;background:linear-gradient(135deg,var(--acc-s),rgba(233,69,96,.05));border-radius:var(--rs);border:1px solid rgba(233,69,96,.15);letter-spacing:.3px}
        .selected-section{padding:.7rem 1.3rem;border-bottom:1px solid var(--bdr)}
        .selected-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
        .selected-header h3{font-size:.7rem;color:var(--td);text-transform:uppercase;letter-spacing:1px;font-weight:600}
        .clear-btn{background:none;border:1px solid rgba(255,255,255,.1);color:var(--td);padding:.2rem .6rem;border-radius:5px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
        .clear-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-s)}
        .selected-list{max-height:130px;overflow-y:auto}
        .selected-item{display:flex;justify-content:space-between;align-items:center;padding:.35rem 0;font-size:.8rem;border-bottom:1px solid var(--bdr);animation:fadeUp .2s ease}
        .remove-btn{background:none;border:none;color:var(--acc);cursor:pointer;font-size:1.2rem;padding:0 .3rem;line-height:1;transition:all .2s;border-radius:50%}
        .remove-btn:hover{color:#ff6b81;background:var(--acc-s)}

        .calc-btn{display:block;width:calc(100% - 2.6rem);margin:.9rem 1.3rem;padding:.7rem;background:linear-gradient(135deg,var(--acc),#d63851);color:#fff;border:none;border-radius:var(--rs);font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:.5px;text-transform:uppercase;position:relative;overflow:hidden}
        .calc-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .6s}
        .calc-btn:hover::before{transform:translateX(100%)}
        .calc-btn:hover{box-shadow:0 4px 20px var(--acc-g);transform:translateY(-1px)}
        .calc-btn:active{transform:translateY(0)}
        .calc-btn:disabled{background:rgba(255,255,255,.05);color:var(--tf);cursor:not-allowed;box-shadow:none}
        .calc-btn:disabled::before{display:none}

        .tab-bar{display:none;border-bottom:1px solid var(--bdr);background:rgba(0,0,0,.15)}
        .tab-bar.visible{display:flex}
        .tab-btn{flex:1;padding:.6rem;background:none;border:none;color:var(--tf);cursor:pointer;font-family:'Inter',sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid transparent;transition:all .3s}
        .tab-btn:hover{color:var(--td)}
        .tab-btn.active{color:var(--acc);border-bottom-color:var(--acc);background:rgba(233,69,96,.03)}

        .results-area{flex:1;overflow-y:auto;padding:1rem 1.3rem;min-height:0}
        .tab-content{display:none}.tab-content.active{display:block;animation:fadeUp .3s ease}
        .section-title{font-family:'Space Grotesk',sans-serif;font-size:.75rem;color:var(--td);text-transform:uppercase;letter-spacing:1.5px;margin:1rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid var(--bdr);font-weight:700}
        .section-title:first-child{margin-top:0}

        .shop-summary{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--acc-s),rgba(233,69,96,.04));border:1px solid rgba(233,69,96,.18);border-radius:var(--r);padding:.7rem .9rem;margin-bottom:.9rem}
        .shop-summary .label{font-size:.65rem;color:var(--td);text-transform:uppercase;letter-spacing:1px;font-weight:700}
        .shop-summary .count{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:#fff;line-height:1}
        .shop-summary .progress{font-size:.7rem;color:var(--acc);font-weight:700;margin-top:.15rem}
        .shop-progress-bar{flex:1;max-width:140px;height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;margin-left:.8rem}
        .shop-progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),#ff6b81);transition:width .3s ease;border-radius:3px}

        .shop-cat{margin-bottom:1.1rem}
        .shop-cat-header{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:linear-gradient(90deg,rgba(255,255,255,.04),transparent);border-left:3px solid var(--acc);border-radius:4px;margin-bottom:.4rem}
        .shop-cat-icon{font-size:1rem;line-height:1}
        .shop-cat-title{font-family:'Space Grotesk',sans-serif;font-size:.78rem;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:1px}
        .shop-cat-count{margin-left:auto;font-size:.65rem;color:var(--td);background:rgba(255,255,255,.05);padding:.12rem .5rem;border-radius:10px;font-weight:600}

        .shopping-item{display:flex;align-items:flex-start;gap:.75rem;padding:.65rem .55rem;border-bottom:1px solid var(--bdr);border-radius:var(--rs);transition:all .2s;margin-bottom:2px}
        .shopping-item:hover{background:rgba(255,255,255,.025);transform:translateX(2px)}
        .shopping-item input[type="checkbox"]{margin-top:.2rem;accent-color:var(--acc);cursor:pointer;width:18px;height:18px;flex-shrink:0}
        .shopping-item.checked{opacity:.35}.shopping-item.checked .item-name{text-decoration:line-through}
        .shopping-item-body{flex:1;min-width:0}
        .item-row{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
        .item-name{font-family:'Space Grotesk',sans-serif;font-size:.92rem;font-weight:700;color:#fff;line-height:1.25}
        .item-amount{font-family:'Space Grotesk',sans-serif;font-size:.95rem;color:var(--acc);font-weight:700;white-space:nowrap;text-align:right}
        .item-amount.no-qty{font-size:.72rem;color:var(--yel);font-style:italic;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
        .item-weight{font-size:.72rem;color:var(--td);margin-top:.25rem;font-weight:500;background:rgba(255,255,255,.03);display:inline-block;padding:.15rem .55rem;border-radius:4px;border:1px solid var(--bdr)}
        .item-sources{font-size:.68rem;color:var(--tf);margin-top:.3rem;font-style:italic}
        .item-sources strong{color:var(--td);font-style:normal;font-weight:600}

        .macro-summary{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.8rem}
        .macro-card{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:var(--r);padding:.7rem .5rem;text-align:center;transition:all .3s}
        .macro-card:hover{background:rgba(255,255,255,.05);transform:translateY(-1px)}
        .macro-card .value{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700}
        .macro-card .label{font-size:.6rem;color:var(--tf);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:.15rem}
        .macro-card.cal{border-color:rgba(233,69,96,.2)}.macro-card.cal .value{color:var(--acc)}
        .macro-card.prot{border-color:rgba(83,215,105,.15)}.macro-card.prot .value{color:var(--grn)}
        .macro-card.fat{border-color:rgba(255,204,0,.12)}.macro-card.fat .value{color:var(--yel)}
        .macro-card.carb{border-color:rgba(90,200,250,.12)}.macro-card.carb .value{color:var(--blu)}
        .per-serving-note{font-size:.7rem;color:var(--tf);text-align:center;margin-bottom:.5rem}

        .breakdown-recipe{margin-bottom:1rem;background:rgba(255,255,255,.02);border:1px solid var(--bdr);border-radius:var(--r);padding:1rem;animation:fadeUp .3s ease backwards}
        .breakdown-recipe h4{font-family:'Space Grotesk',sans-serif;font-size:.95rem;color:#fff;margin-bottom:.15rem;font-weight:700}
        .breakdown-recipe .scale-info{font-size:.75rem;color:var(--td);margin-bottom:.7rem;padding-bottom:.5rem;border-bottom:1px solid var(--bdr)}
        .breakdown-recipe .scale-badge{display:inline-block;background:linear-gradient(135deg,var(--acc-s),rgba(233,69,96,.2));color:var(--acc);padding:.15rem .5rem;border-radius:5px;font-weight:700;font-size:.75rem;margin-left:.4rem;border:1px solid rgba(233,69,96,.2)}
        .ing-item{padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
        .ing-item:hover{background:rgba(255,255,255,.02)}
        .ing-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
        .ing-name{color:#fff;font-weight:600;font-size:.88rem;flex:1;min-width:0}
        .ing-amount{color:var(--acc);font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:.88rem;text-align:right;white-space:nowrap}
        .ing-detail{display:flex;justify-content:space-between;align-items:baseline;margin-top:.15rem;gap:.5rem}
        .ing-weight{font-size:.72rem;color:var(--td);font-weight:500}
        .ing-orig{font-size:.72rem;color:var(--tf);text-align:right;font-style:italic}
        .no-qty-item{color:var(--td);font-size:.82rem;padding:.35rem .5rem;font-weight:500;background:rgba(255,255,255,.02);border-radius:5px;margin-bottom:3px;display:flex;align-items:center;gap:.5rem}
        .no-qty-item::before{content:"\2022";color:var(--acc);font-size:1.2rem;line-height:0}
        .empty-state{text-align:center;padding:2rem 1rem;color:var(--tf);font-size:.82rem}
        .recipe-count{font-size:.75rem;color:var(--tf);margin-bottom:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

        .macro-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.04);margin:.5rem 0 1rem;border:1px solid var(--bdr)}
        .macro-bar-seg{height:100%;transition:width .4s ease}
        .macro-bar-seg.prot{background:var(--grn)}
        .macro-bar-seg.fat{background:var(--yel)}
        .macro-bar-seg.carb{background:var(--blu)}
        .macro-legend{display:flex;justify-content:space-around;font-size:.68rem;color:var(--td);margin-bottom:.7rem;font-weight:600}
        .macro-legend span{display:flex;align-items:center;gap:.3rem}
        .macro-legend i{display:inline-block;width:8px;height:8px;border-radius:2px}
        .macro-legend i.prot{background:var(--grn)}.macro-legend i.fat{background:var(--yel)}.macro-legend i.carb{background:var(--blu)}

        .suggest-btn{padding:.35rem .85rem;border:1px solid rgba(255,204,0,.3);border-radius:25px;background:linear-gradient(135deg,rgba(255,204,0,.08),rgba(255,107,129,.08));color:var(--yel);cursor:pointer;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;transition:all .3s;letter-spacing:.3px;display:inline-flex;align-items:center;gap:.3rem}
        .suggest-btn:hover{background:linear-gradient(135deg,rgba(255,204,0,.15),rgba(255,107,129,.15));border-color:var(--yel);color:#fff;box-shadow:0 2px 12px rgba(255,204,0,.2)}
        .suggest-btn.active{background:linear-gradient(135deg,var(--yel),#ff9f43);border-color:transparent;color:#1a1a1a;box-shadow:0 2px 12px rgba(255,204,0,.3)}

        .suggest-section{margin-bottom:1.4rem;animation:fadeUp .4s ease backwards}
        .suggest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
        .suggest-header{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;padding:.6rem .8rem;background:linear-gradient(90deg,rgba(255,255,255,.04),transparent);border-radius:8px;border-left:3px solid var(--yel)}
        .suggest-icon{font-size:1.3rem}
        .suggest-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;color:#fff;font-weight:700}
        .suggest-desc{font-size:.72rem;color:var(--td);margin-top:.15rem}
        .suggest-cta{margin-left:auto;font-size:.7rem;color:var(--yel);font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;padding:.25rem .6rem;border:1px solid rgba(255,204,0,.3);border-radius:5px;background:none;transition:all .2s}
        .suggest-cta:hover{background:rgba(255,204,0,.1);color:#fff}

        @media(max-width:900px){
            .main-layout{flex-direction:column;height:auto}body{overflow:auto}
            .prep-panel{width:100%;min-width:100%;border-left:none;border-top:1px solid var(--bdr)}
            .recipe-panel{max-height:55vh;overflow-y:auto}.results-area{max-height:50vh}
        }
    </style>
</head>
<body>
    <header>
        <h1><span>Trust The Skinny Chef</span> &mdash; Meal Prep</h1>
        <div class="header-controls">
            <input type="text" class="search-box" id="search" placeholder="Search recipes..." autocomplete="off">
            <div class="category-filters">
                <button class="cat-btn active" data-cat="all">All</button>
                <button class="cat-btn" data-cat="Breakfast">Breakfast</button>
                <button class="cat-btn" data-cat="Lunch & Dinner">Lunch &amp; Dinner</button>
                <button class="cat-btn" data-cat="Dessert">Dessert</button>
                <button class="suggest-btn" id="suggest-btn" title="Get suggestions"><span>&#10024;</span> Suggestions</button>
            </div>
        </div>
    </header>
    <div class="main-layout">
        <div class="recipe-panel">
            <div class="recipe-count" id="recipe-count"></div>
            <div class="recipe-grid" id="recipe-grid"></div>
        </div>
        <div class="prep-panel">
            <div class="prep-header">
                <h2>Meal Prep Settings</h2>
                <div class="serving-controls">
                    <div class="serving-group"><label>People</label><input type="number" id="people" value="2" min="1" max="99"></div>
                    <div class="serving-group"><label>Servings / Person</label><input type="number" id="spp" value="6" min="1" max="99"></div>
                </div>
                <div class="total-servings" id="total-servings">Total: 12 servings per recipe</div>
            </div>
            <div class="selected-section">
                <div class="selected-header">
                    <h3>Selected (<span id="sel-count">0</span>)</h3>
                    <button class="clear-btn" id="clear-btn">Clear All</button>
                </div>
                <div class="selected-list" id="selected-list"><div class="empty-state">Click recipes to select them</div></div>
            </div>
            <button class="calc-btn" id="calc-btn" disabled>Calculate Ingredients</button>
            <div class="tab-bar" id="tab-bar">
                <button class="tab-btn active" data-tab="shopping">Shopping List</button>
                <button class="tab-btn" data-tab="breakdown">Per Recipe</button>
                <button class="tab-btn" data-tab="macros">Macros</button>
            </div>

const selected = new Set();
let curCat = 'all', query = '', suggestMode = false, suggestSeed = Date.now();
const TEXT_NUMS = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
const UNITS = ['Cups','Cup','Tbsps','Tbsp','Tsps','Tsp','Pounds','Pound','oz','Scoops','Scoop','Slices','Slice','Cloves','Clove','Packets','Packet','Cans','Can','Pinch','Handful'];
const G_PER_OZ = 28.3495;

function extractUnit(rest) {
    for (const x of UNITS) {
        if (rest.toLowerCase().startsWith(x.toLowerCase())) {
            return {unit:x, rest:rest.slice(x.length).trim()};
        }
    }
    return {unit:'', rest};
}

function parseQty(s) {
    s = s.trim();
    let grams = null;
    const gRange = s.match(/\((\d+\.?\d*)\s*-\s*(\d+\.?\d*)\s*g\)/);
    if (gRange) {
        grams = (parseFloat(gRange[1]) + parseFloat(gRange[2])) / 2;
    } else {
        const gM = s.match(/\((\d+\.?\d*)\s*g\)/);
        if (gM) grams = parseFloat(gM[1]);
    }
    const clean = s.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();

    const rangeM = clean.match(/^(\d+\.?\d*)\s*-\s*(\d+\.?\d*)\s+/);
    if (rangeM) {
        const qty = (parseFloat(rangeM[1]) + parseFloat(rangeM[2])) / 2;
        const {unit, rest} = extractUnit(clean.slice(rangeM[0].length).trim());
        return {qty, unit, name:rest, grams};
    }

    const m = clean.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+\.?\d*)\s*/);
    if (!m) {
        const w = clean.split(/\s+/)[0].toLowerCase();
        if (TEXT_NUMS[w] !== undefined) {
            const {unit, rest} = extractUnit(clean.slice(w.length).trim());
            return {qty:TEXT_NUMS[w], unit, name:rest, grams};
        }
        return {qty:null, unit:'', name:clean, grams:null};
    }
    const qs = m[1].trim();
    let qty;
    if (qs.includes(' ') && qs.includes('/')) { const p=qs.split(/\s+/); const [n,d]=p[1].split('/'); qty=parseFloat(p[0])+parseFloat(n)/parseFloat(d); }
    else if (qs.includes('/')) { const [n,d]=qs.split('/'); qty=parseFloat(n)/parseFloat(d); }
    else qty = parseFloat(qs);
    const {unit, rest} = extractUnit(clean.slice(m[0].length).trim());
    return {qty, unit, name:rest, grams};
}

function normName(n) { return n.replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim().toLowerCase(); }

function fmtQty(q) {
    if (q==null) return '';
    const fr={0.25:'1/4',0.33:'1/3',0.5:'1/2',0.67:'2/3',0.75:'3/4',0.125:'1/8',0.375:'3/8',0.625:'5/8',0.875:'7/8'};
    const w=Math.floor(q), f=Math.round((q-w)*1000)/1000;
    if (f===0) return w.toString();
    let best=null, bd=0.05;
    for (const [v,n] of Object.entries(fr)) { const d=Math.abs(f-parseFloat(v)); if(d<bd){bd=d;best=n;} }
    if (best) return w>0 ? w+' '+best : best;
    return q===Math.floor(q) ? q.toString() : q.toFixed(1);
}

function fmtWeight(g) {
    const oz = g / G_PER_OZ;
    const gStr = Math.round(g) + 'g';
    const ozStr = oz >= 10 ? Math.round(oz) + ' oz' : oz.toFixed(1) + ' oz';
    return gStr + '  /  ' + ozStr;
}

function fmtAmt(q, u) { return q==null ? '' : (fmtQty(q)+' '+u).trim(); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

const SHOP_CATS = [
    {key:'spice', icon:'🧂', title:'Spices & Seasonings', kw:['garlic salt','garlic powder','onion powder','italian seasoning','smoked paprika','paprika','cinnamon','oregano','cumin','chili powder','cajun seasoning','red pepper flakes','black pepper','parsley flakes','taco seasoning','ranch seasoning','everything bagel seasoning','seasoning','salt','rub']},
    {key:'protein', icon:'🥩', title:'Proteins', kw:['chicken','beef','turkey','salmon','shrimp','tuna','tofu','steak','pork','bacon','sausage','ground meat']},

    {key:'produce', icon:'🥬', title:'Produce', kw:['garlic','fresh parsley','parsley','chives','spinach','broccoli','tomato','lettuce','onion','lemon','lime','avocado','mushroom','carrot','basil','cilantro','jalapeno','bell pepper','cucumber','zucchini','kale','arugula','sweet potato','potato','banana','berry','strawberry','blueberry','apple','asparagus']},

    {key:'pantry', icon:'🥫', title:'Pantry & Sauces', kw:['light mayo','mayo','sriracha','soy sauce','ketchup','mustard','oil','salsa','honey','syrup','vinegar','broth','stock','sauce','jam','jelly','peanut butter','olive','marinara','adobo','chipotle pepper','tomato sauce','dressing','tahini','hot sauce']},
    {key:'snack', icon:'🥨', title:'Snacks & Extras', kw:['protein chips','chips','cracker','pretzel','nut','almond','cashew','walnut','seed','granola']},
    {key:'other', icon:'📦', title:'Other', kw:[]}
];

function shopCat(name) {
    const n = name.toLowerCase();
    for (const c of SHOP_CATS) {
        if (c.key === 'other') continue;
        for (const k of c.kw) {
            if (n.includes(k)) return c.key;
        }
    }
    return 'other';
}

function calculate() {
    const ppl = parseInt(document.getElementById('people').value) || 1;
    const spp = parseInt(document.getElementById('spp').value) || 1;
    const total = ppl * spp, perRecipe = [], combined = {};

    for (const idx of selected) {
        const r = recipes[idx], scale = total / r.servings, ings = [];
        for (const is of r.ingredients) {
            const p = parseQty(is);
            if (p.qty !== null) {
                const sq = p.qty * scale;
                const sg = p.grams ? p.grams * scale : null;
                ings.push({name:p.name, qty:sq, unit:p.unit, grams:sg, oQty:p.qty, oUnit:p.unit, oGrams:p.grams, hasQty:true});
                const key = normName(p.name) + '||' + p.unit.toLowerCase().replace(/s$/,'');
                if (!combined[key]) combined[key] = {qty:0, unit:p.unit, name:p.name, grams:0, hasG:false, src:[], hasQty:true};
                combined[key].qty += sq;
                if (sg) { combined[key].grams += sg; combined[key].hasG = true; }
                combined[key].src.push({r:r.name, amt:fmtAmt(sq, p.unit), g:sg});
            } else {
                ings.push({name:p.name, qty:null, unit:'', grams:null, hasQty:false});
                const key = normName(p.name) + '||';
                if (!combined[key]) combined[key] = {qty:null, unit:'', name:p.name, grams:0, hasG:false, src:[], hasQty:false};
                combined[key].src.push({r:r.name, amt:'to taste', g:null});
            }
        }
        perRecipe.push({name:r.name, base:r.servings, total, scale:Math.round(scale*100)/100, ings});
    }

    const shopping = Object.values(combined).sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    const ps = {cal:0, prot:0, fat:0, carb:0}, tm = {cal:0, prot:0, fat:0, carb:0};
    for (const i of selected) {
        const r = recipes[i];
        ps.cal += r.calories; ps.prot += r.protein; ps.fat += r.fat; ps.carb += r.carbs;
        tm.cal += r.calories*total; tm.prot += r.protein*total; tm.fat += r.fat*total; tm.carb += r.carbs*total;
    }
    showResults({perRecipe, shopping, ps, tm, ppl, spp, total});
}

function shopItemHTML(it, i) {
    let amtHTML;
    if (it.hasQty) {
        const amt = fmtAmt(it.qty, it.unit);
        amtHTML = '<span class="item-amount">' + esc(amt) + '</span>';
    } else {
        amtHTML = '<span class="item-amount no-qty">To taste</span>';
    }
    const wt = it.hasQty && it.hasG ? fmtWeight(it.grams) : '';
    const src = it.src.length > 1
        ? '<div class="item-sources"><strong>Used in:</strong> ' + it.src.map(s => esc(s.r)).join(', ') + '</div>'
        : '';
    return '<label class="shopping-item" id="si' + i + '">' +
        '<input type="checkbox">' +
        '<div class="shopping-item-body">' +
        '<div class="item-row">' +
        '<span class="item-name">' + esc(it.name) + '</span>' +
        amtHTML +
        '</div>' +
        (wt ? '<div class="item-weight">' + esc(wt) + '</div>' : '') +
        src + '</div></label>';
}

function showResults(d) {
    document.getElementById('tab-bar').classList.add('visible');

    const grouped = {};
    d.shopping.forEach(it => {
        const cat = shopCat(it.name);
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(it);
    });

    let shopHTML = '<div class="shop-summary">' +
        '<div><div class="label">Shopping List</div>' +
        '<div class="count">' + d.shopping.length + ' <span style="font-size:.7rem;color:var(--td);font-weight:600">items</span></div>' +
        '<div class="progress" id="shop-progress">0 / ' + d.shopping.length + ' checked</div></div>' +
        '<div class="shop-progress-bar"><div class="shop-progress-fill" id="shop-fill" style="width:0%"></div></div>' +
        '</div>';

    let itemIdx = 0;
    for (const cat of SHOP_CATS) {
        const items = grouped[cat.key];
        if (!items || !items.length) continue;
        shopHTML += '<div class="shop-cat">' +
            '<div class="shop-cat-header">' +
            '<span class="shop-cat-icon">' + cat.icon + '</span>' +
            '<span class="shop-cat-title">' + cat.title + '</span>' +
            '<span class="shop-cat-count">' + items.length + '</span>' +
            '</div>' +
            items.map(it => shopItemHTML(it, itemIdx++)).join('') +
            '</div>';
    }
    document.getElementById('tab-shopping').innerHTML = shopHTML;
    updateShopProgress();

    document.getElementById('tab-breakdown').innerHTML =
        d.perRecipe.map(pr => {
            const qi = pr.ings.filter(i => i.hasQty);
            const ni = pr.ings.filter(i => !i.hasQty);
            return '<div class="breakdown-recipe">' +
                '<h4>' + esc(pr.name) + '</h4>' +
                '<div class="scale-info">Recipe makes ' + pr.base + ' servings \u2192 scaled to ' + pr.total +
                '<span class="scale-badge">' + pr.scale + 'x</span></div>' +
                qi.map(i => {
                    const weightStr = i.grams ? fmtWeight(i.grams) : '';
                    const origStr = 'was ' + fmtAmt(i.oQty, i.oUnit) + (i.oGrams ? ' (' + Math.round(i.oGrams) + 'g)' : '');
                    return '<div class="ing-item">' +
                        '<div class="ing-top">' +
                        '<span class="ing-name">' + esc(i.name) + '</span>' +
                        '<span class="ing-amount">' + esc(fmtAmt(i.qty, i.unit)) + '</span>' +
                        '</div>' +
                        '<div class="ing-detail">' +
                        '<span class="ing-weight">' + (weightStr ? esc(weightStr) : '') + '</span>' +
                        '<span class="ing-orig">' + esc(origStr) + '</span>' +
                        '</div></div>';
                }).join('') +
                (ni.length ? ni.map(i => '<div class="no-qty-item">' + esc(i.name) + '</div>').join('') : '') +
                '</div>';
        }).join('');

    document.getElementById('tab-macros').innerHTML =
        '<div class="section-title">Per Serving (one meal)</div>' +
        '<div class="per-serving-note">Combined macros for one serving of each selected recipe</div>' +
        macroBar(d.ps) +
        mGrid(d.ps, '') +
        '<div class="section-title">Total Batch (' + d.total + ' servings for ' + d.ppl + ' people)</div>' +
        macroBar(d.tm) +
        mGrid(d.tm, 'Total ');
}

function updateShopProgress() {
    const items = document.querySelectorAll('#tab-shopping .shopping-item');
    const checked = document.querySelectorAll('#tab-shopping .shopping-item.checked').length;
    const pct = items.length ? Math.round((checked / items.length) * 100) : 0;
    const fill = document.getElementById('shop-fill');
    const prog = document.getElementById('shop-progress');
    if (fill) fill.style.width = pct + '%';
    if (prog) prog.textContent = checked + ' / ' + items.length + ' checked';
}

function macroBar(m) {
    const pCal = m.prot * 4, fCal = m.fat * 9, cCal = m.carb * 4;
    const sum = pCal + fCal + cCal || 1;
    const p = (pCal / sum * 100).toFixed(1), f = (fCal / sum * 100).toFixed(1), c = (cCal / sum * 100).toFixed(1);
    return '<div class="macro-bar">' +
        '<div class="macro-bar-seg prot" style="width:' + p + '%" title="Protein ' + p + '%"></div>' +
        '<div class="macro-bar-seg fat" style="width:' + f + '%" title="Fat ' + f + '%"></div>' +
        '<div class="macro-bar-seg carb" style="width:' + c + '%" title="Carbs ' + c + '%"></div>' +
        '</div>' +
        '<div class="macro-legend">' +
        '<span><i class="prot"></i>Protein ' + p + '%</span>' +
        '<span><i class="fat"></i>Fat ' + f + '%</span>' +
        '<span><i class="carb"></i>Carbs ' + c + '%</span>' +
        '</div>';
}

function mGrid(m, p) {
    return '<div class="macro-summary">' +
        mc('cal', Math.round(m.cal), p+'Calories') +
        mc('prot', Math.round(m.prot)+'g', p+'Protein') +
        mc('fat', Math.round(m.fat)+'g', p+'Fat') +
        mc('carb', Math.round(m.carb)+'g', p+'Carbs') + '</div>';
}
function mc(c, v, l) { return '<div class="macro-card '+c+'"><div class="value">'+v+'</div><div class="label">'+l+'</div></div>'; }

function recipeCardHTML(r, i, idx) {
    return '<div class="recipe-card' + (selected.has(i) ? ' selected' : '') + '" onclick="toggle(' + i + ')" style="animation-delay:' + (idx*0.02) + 's">' +
        '<img class="recipe-img" src="images/page_' + r.page + '.jpg" alt="' + esc(r.name) + '" loading="lazy" onerror="this.outerHTML=\'<div class=recipe-img-placeholder>&#127860;</div>\'">' +
        '<div class="recipe-info"><div class="recipe-category">' + esc(r.category) + '</div>' +
        '<div class="recipe-name">' + esc(r.name) + '</div>' +
        '<div class="recipe-macros">' +
        '<span class="macro-badge cal">' + r.calories + ' cal</span>' +
        '<span class="macro-badge prot">' + r.protein + 'g P</span>' +
        '<span class="macro-badge fat">' + r.fat + 'g F</span>' +
        '<span class="macro-badge carb">' + r.carbs + 'g C</span></div>' +
        '<div class="recipe-servings">Makes ' + r.servings + ' servings</div></div></div>';
}

function seededShuffle(arr, seed) {
    const a = arr.slice();
    let s = seed;
    for (let i = a.length - 1; i > 0; i--) {
        s = (s * 9301 + 49297) % 233280;
        const j = Math.floor((s / 233280) * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function buildSuggestions() {
    const indexed = recipes.map((r, i) => ({r, i}));

    const surprise = seededShuffle(indexed, suggestSeed).slice(0, 6);
    const highProtein = indexed.slice().sort((a, b) =>
        (b.r.protein / Math.max(b.r.calories, 1)) - (a.r.protein / Math.max(a.r.calories, 1))
    ).slice(0, 6);
    const lightLean = indexed.slice().sort((a, b) => a.r.calories - b.r.calories).slice(0, 6);
    const calorieDense = indexed.slice().sort((a, b) => b.r.calories - a.r.calories).slice(0, 6);

    // Balanced: closest to 30P / 30F / 40C in calorie distribution
    const balanced = indexed.map(({r, i}) => {
        const pCal = r.protein * 4, fCal = r.fat * 9, cCal = r.carbs * 4;
        const sum = pCal + fCal + cCal || 1;
        const dist = Math.abs(pCal/sum - 0.30) + Math.abs(fCal/sum - 0.30) + Math.abs(cCal/sum - 0.40);
        return {r, i, dist};
    }).sort((a, b) => a.dist - b.dist).slice(0, 6);

    const breakfast = seededShuffle(indexed.filter(x => x.r.category === 'Breakfast'), suggestSeed + 1).slice(0, 6);
    const dessert = seededShuffle(indexed.filter(x => x.r.category === 'Dessert'), suggestSeed + 2).slice(0, 6);

    return [
        {icon:'🎯', title:'Surprise Me', desc:'A fresh shuffle every time — click to reroll', items:surprise, reroll:true},
        {icon:'💪', title:'High Protein', desc:'Best protein-per-calorie ratio', items:highProtein},
        {icon:'⚖️', title:'Balanced Macros', desc:'Closest to 30% protein / 30% fat / 40% carbs', items:balanced},
        {icon:'🍃', title:'Light & Lean', desc:'Lowest calorie picks', items:lightLean},
        {icon:'🔥', title:'Calorie Dense', desc:'For bulking or active days', items:calorieDense},
        {icon:'☀️', title:'Breakfast Picks', desc:'Start the day right', items:breakfast},
        {icon:'🍰', title:'Dessert Picks', desc:'Treat yourself', items:dessert},
    ].filter(s => s.items.length > 0);
}

let suggestCache = null, suggestCacheSeed = null;
function getSuggestions() {
    if (suggestCacheSeed !== suggestSeed) {
        suggestCache = buildSuggestions();
        suggestCacheSeed = suggestSeed;
    }
    return suggestCache;
}

function renderSuggestions() {
    const grid = document.getElementById('recipe-grid'), cnt = document.getElementById('recipe-count');
    const sections = getSuggestions();
    cnt.textContent = 'Curated suggestions • click any recipe to add it';
    grid.style.display = 'block';
    grid.innerHTML = sections.map((sec, sIdx) =>
        '<div class="suggest-section" style="animation-delay:' + (sIdx * 0.05) + 's">' +
            '<div class="suggest-header">' +
            '<span class="suggest-icon">' + sec.icon + '</span>' +
            '<div><div class="suggest-title">' + sec.title + '</div>' +
            '<div class="suggest-desc">' + sec.desc + '</div></div>' +
            (sec.reroll ? '<button class="suggest-cta" onclick="rerollSuggest()">↻ Reroll</button>' : '') +
            '</div>' +
            '<div class="suggest-grid">' +
            sec.items.map((x, idx) => recipeCardHTML(x.r, x.i, idx)).join('') +
            '</div></div>'
    ).join('');
}

function rerollSuggest() {
    suggestSeed = Date.now();
    renderSuggestions();
}

function renderRecipes() {
    if (suggestMode) { renderSuggestions(); return; }
    const grid = document.getElementById('recipe-grid'), cnt = document.getElementById('recipe-count');
    grid.style.display = '';
    const filt = [];
    recipes.forEach((r, i) => {
        if (curCat !== 'all' && r.category !== curCat) return;
        if (query && !r.name.toLowerCase().includes(query)) return;
        filt.push({r, i});
    });
    cnt.textContent = filt.length + ' recipes';
    grid.innerHTML = filt.map(({r, i}, idx) => recipeCardHTML(r, i, idx)).join('');
}

function renderSelected() {
    const list = document.getElementById('selected-list'), cnt = document.getElementById('sel-count'), btn = document.getElementById('calc-btn');
    cnt.textContent = selected.size;
    btn.disabled = selected.size === 0;
    if (!selected.size) { list.innerHTML = '<div class="empty-state">Click recipes to select them</div>'; return; }
    list.innerHTML = Array.from(selected).map(i => {
        const r = recipes[i];
        return '<div class="selected-item"><span>' + esc(r.name) + '</span><button class="remove-btn" onclick="event.stopPropagation();toggle(' + i + ')">&times;</button></div>';
    }).join('');
}

function updateTotal() {
    const p = parseInt(document.getElementById('people').value) || 1;
    const s = parseInt(document.getElementById('spp').value) || 1;
    document.getElementById('total-servings').textContent = 'Total: ' + (p*s) + ' servings per recipe';
}

function toggle(i) { selected.has(i) ? selected.delete(i) : selected.add(i); renderRecipes(); renderSelected(); }

document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.toLowerCase();
    if (query) {
        suggestMode = false;
        document.getElementById('suggest-btn').classList.remove('active');
    }
    renderRecipes();
});
document.querySelectorAll('.cat-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curCat = b.dataset.cat;
    suggestMode = false;
    document.getElementById('suggest-btn').classList.remove('active');
    renderRecipes();
}));
document.getElementById('suggest-btn').addEventListener('click', () => {
    suggestMode = !suggestMode;
    const btn = document.getElementById('suggest-btn');
    btn.classList.toggle('active', suggestMode);
    if (suggestMode) {
        document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
        suggestSeed = Date.now();
    } else {
        document.querySelector('.cat-btn[data-cat="all"]').classList.add('active');
        curCat = 'all';
    }
    renderRecipes();
});
document.getElementById('people').addEventListener('input', updateTotal);
document.getElementById('spp').addEventListener('input', updateTotal);
document.getElementById('calc-btn').addEventListener('click', calculate);
document.getElementById('clear-btn').addEventListener('click', () => {
    selected.clear(); renderRecipes(); renderSelected();
    document.getElementById('tab-bar').classList.remove('visible');
    ['tab-shopping','tab-breakdown','tab-macros'].forEach(id => document.getElementById(id).innerHTML = '');
});
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-' + b.dataset.tab).classList.add('active');
}));
document.getElementById('tab-shopping').addEventListener('change', e => {
    if (e.target.matches('input[type="checkbox"]')) {
        e.target.closest('.shopping-item').classList.toggle('checked', e.target.checked);
        updateShopProgress();
    }
});

renderRecipes();
</script>
</body>
